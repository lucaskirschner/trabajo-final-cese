# =============================================================================
# @file    project.yml
# @author  Lucas Kirschner <kirschnerlucas1@gmail.com>
# @date    2026-09-25
# @brief   Ceedling unit-test configuration for MEC-SCMCII-COORDINATOR.
#
# @details
# This file configures the host-based unit-test environment used to validate
# the main firmware drivers with Ceedling, Unity, and CMock.
#
# Production source files are compiled directly from the firmware tree without
# duplicating them inside the test environment. Hardware-dependent port-layer
# functions are replaced by mocks during unit testing.
#
# The configured driver modules are:
#  - SCLT38BT8 digital input driver
#  - VNI8200XP32 digital output driver
#  - RS485 communication driver
#  - MRF24J40 wireless communication driver
#
# Test build artifacts are kept separate from the STM32CubeIDE build output.
# =============================================================================

---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.9
  :build_root: build/ceedling
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - +:Test/**

  :source:
    - System/Drivers/SCLT38BT8/**
    - System/Drivers/VNI8200XP32/**
    - System/Drivers/RS485/**
    - System/Drivers/MRF24J40/**

  :include:
    - System/Drivers/SCLT38BT8
    - System/Drivers/VNI8200XP32
    - System/Drivers/RS485
    - System/Drivers/MRF24J40
    - System/BSP/IO
    - System/BSP/RS485

:defines:
  :test:
    - TEST

:cmock:
  :plugins:
    - :ignore
    - :callback

  :strippables:
    - 'void\s+rs485_port_tx_complete_callback\s*\(\s*void\s*\)\s*;'
    - 'void\s+rs485_port_rx_complete_callback\s*\(\s*void\s*\)\s*;'
    - 'void\s+rs485_port_error_callback\s*\(\s*uint32_t\s+error_code\s*\)\s*;'